<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簽到紀錄｜運動科學實驗室簽到系統</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="./assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script defer src="./assets/common.js"></script>
  <script defer src="./assets/history.js"></script>
</head>
<body data-page="history" data-title="簽到紀錄">
  <main class="page-container">
    <div class="page-heading">
      <h1>簽到紀錄查詢</h1>
      <p>依日期查看使用身分、進出時間、協助簽退及責任交接紀錄。</p>
    </div>

    <div id="message" class="message hidden"></div>

    <section class="card">
      <div class="date-controls">
        <label for="history-date">
          查詢日期
          <input id="history-date" type="text" placeholder="YYYY-MM-DD"
            autocomplete="off" inputmode="none">
        </label>
        <button id="history-refresh-button" class="secondary-button" type="button">
          查詢紀錄
        </button>
      </div>
      <p class="date-marker-hint">
        <span class="date-marker-dot" aria-hidden="true"></span>
        日曆上的藍點代表當天有簽到紀錄。
      </p>

      <p id="history-status" class="section-status" aria-live="polite">
        正在讀取簽到紀錄……
      </p>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>
</body>
</html>
