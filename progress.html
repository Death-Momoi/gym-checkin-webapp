<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>訓練進步圖表｜運動科學實驗室簽到系統</title><link rel="stylesheet" href="./assets/styles.css"><script defer src="./assets/common.js"></script><script defer src="./assets/rest-timer.js"></script><script defer src="./assets/training-store.js"></script><script defer src="./assets/fitness-metrics.js"></script><script defer src="./assets/local-charts.js"></script><script defer src="./assets/fitness-pages.js"></script></head><body data-page="progress" data-title="訓練進步圖表"><main class="page-container fitness-page"><div class="page-heading"><span class="training-eyebrow">YOUR PROGRESS · 每一次都算數</span><h1>訓練進步圖表</h1><p>把每一天的累積，連成看得見的進步。</p></div><div id="message" class="message hidden" role="status" aria-live="polite"></div>
