<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問題回報處理｜運動科學實驗室簽到系統</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="./assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script defer src="./assets/common.js"></script>
  <script defer src="./assets/admin.js"></script>
</head>
<body data-page="admin" data-title="問題回報處理">
  <main class="page-container">
    <div class="page-heading">
      <h1>問題回報處理</h1>
      <p>所有已登入使用者都可查看回報紀錄，僅管理員可變更處理狀態。</p>
    </div>

    <div id="message" class="message hidden"></div>

    <section id="admin-content" class="card">
      <p id="issue-permission-note" class="permission-note"></p>

      <div class="issue-filter-fields">
        <label for="issue-status-filter">
          顯示狀態
          <select id="issue-status-filter">
            <option value="open">待處理</option>
            <option value="resolved">已解決</option>
            <option value="all">全部</option>
          </select>
        </label>
        <label for="issue-date-filter">
          回報日期
          <input id="issue-date-filter" type="text" placeholder="點擊選擇日期"
            autocomplete="off" inputmode="none">
        </label>
      </div>

      <div class="issue-filter-actions">
        <button id="issue-date-search-button" class="primary-button" type="button">
          查詢日期
        </button>
        <button id="issue-date-clear-button" class="secondary-button" type="button">
          全部日期
        </button>
        <button id="issue-refresh-button" class="secondary-button" type="button">
          重新整理
        </button>
      </div>
      <p class="date-marker-hint">
        <span class="date-marker-dot" aria-hidden="true"></span>
        日曆上的藍點代表當天有人實際簽到。
      </p>

      <p id="issue-admin-status" class="section-status" aria-live="polite">
        正在讀取問題回報……
      </p>
      <ul id="issue-admin-list" class="admin-issue-list"></ul>
    </section>
  </main>
</body>
</html>
