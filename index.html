<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首頁｜運動科學實驗室簽到系統</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./assets/common.js"></script>
  <script defer src="./assets/home.js"></script>
</head>
<body data-page="home" data-title="首頁">
  <main class="page-container">
    <div class="page-heading">
      <h1>運動科學實驗室簽到系統</h1>
      <p>使用左上角功能列切換各項功能，每位使用者皆須使用 Google 帳號登入。</p>
    </div>

    <div id="message" class="message">正在初始化……</div>

    <section id="signed-out-card" class="card hidden">
      <h2>Google 帳號登入</h2>
      <p class="hint">登入後才能使用簽到、預約查詢及問題回報等功能。</p>
      <button id="login-button" class="google-button" type="button">
        使用 Google 帳號登入
      </button>
    </section>

    <div id="signed-in-content" class="hidden">
      <section class="card">
        <div class="identity">
          <img id="home-avatar" class="avatar" alt="使用者頭像">
          <div>
            <strong id="home-name">—</strong>
            <span id="home-email">—</span>
          </div>
        </div>
        <div id="home-attendance-state" class="state-box">正在讀取簽到狀態……</div>
        <button id="home-logout-button" class="secondary-button" type="button">登出</button>
      </section>

      <section class="card">
        <h2>功能捷徑</h2>
        <div class="shortcut-grid">
          <a class="shortcut-card" href="./checkin.html">
            <strong>簽到／簽退</strong>
            <span>選擇使用身分、責任交接及設備檢查。</span>
          </a>
          <a class="shortcut-card" href="./present.html">
            <strong>目前在場</strong>
            <span>查看現在仍在健身房內的人員。</span>
          </a>
          <a class="shortcut-card" href="./assist.html">
            <strong>協助簽退</strong>
            <span>協助忘記操作的共同使用者完成簽退。</span>
          </a>
          <a class="shortcut-card" href="./calendar.html">
            <strong>預約月曆</strong>
            <span>查詢指定日期的 Google Calendar 預約。</span>
          </a>
          <a class="shortcut-card" href="./history.html">
            <strong>簽到紀錄</strong>
            <span>依日期查詢過去的簽到與簽退紀錄。</span>
          </a>
          <a class="shortcut-card" href="./report.html">
            <strong>問題回報</strong>
            <span>回報設備或環境異常並寄送 Gmail 通知。</span>
          </a>
          <a id="admin-shortcut" class="shortcut-card hidden" href="./admin.html">
            <strong>問題回報管理</strong>
            <span>查看全部回報，並切換待處理與已解決狀態。</span>
          </a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
