<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簽到／簽退｜運動科學實驗室簽到系統</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./assets/common.js"></script>
  <script defer src="./assets/home.js"></script>
</head>
<body data-page="home" data-title="簽到／簽退">
  <main class="page-container home-checkin-page">
    <div class="page-heading home-system-heading">
      <h1>運動科學實驗室簽到系統</h1>
      <p>進入實驗室後請先使用 Google 帳號登入並完成簽到；離開前請記得簽退。</p>
    </div>

    <div id="message" class="message">正在初始化……</div>

    <section id="signed-out-card" class="card hidden">
      <h2>Google 帳號登入</h2>
      <p class="hint">每位使用者都必須先登入，系統才能確認簽到身分。</p>
      <button id="login-button" class="google-button" type="button">
        使用 Google 帳號登入
      </button>
      <p class="home-guide-link">
        第一次使用？<a href="./guide.html">查看系統使用說明</a>
      </p>
    </section>

    <div id="signed-in-content" class="hidden">
      <section class="card home-identity-card">
        <div class="identity">
          <img id="home-avatar" class="avatar" alt="使用者頭像">
          <div>
            <strong id="home-name">—</strong>
            <span id="home-email">—</span>
          </div>
        </div>
        <button id="home-logout-button" class="secondary-button" type="button">
          登出 Google 帳號
        </button>
      </section>

      <section class="card">
        <h2>簽到／簽退</h2>
        <div id="attendance-state" class="state-box">正在讀取簽到狀態……</div>

        <div id="check-in-controls" class="hidden">
          <p class="hint">請選擇本次使用身分：</p>
          <div class="role-options">
            <label class="role-option">
              <input type="radio" name="gym-role" value="member" checked>
              共同使用者
            </label>
            <label class="role-option">
              <input type="radio" name="gym-role" value="primary">
              主要借用者
            </label>
          </div>
          <button id="check-in-button" class="primary-button" type="button">簽到</button>
        </div>

        <div id="check-out-controls" class="hidden">
          <div id="primary-checkout-controls" class="hidden">
            <p class="hint">
              如果現場有人可以接替，可選擇責任交接；否則請完成三項設備檢查。
            </p>
            <label for="transfer-user">責任交接（選填）</label>
            <select id="transfer-user">
              <option value="">不交接，由我完成設備檢查</option>
            </select>

            <div id="equipment-checks" class="checks">
              <label class="check-option">
                <input id="trash-check" type="checkbox">
                垃圾已清理
              </label>
              <label class="check-option">
                <input id="ac-lights-check" type="checkbox">
                冷氣與電燈已關閉
              </label>
              <label class="check-option">
                <input id="dehumidifier-check" type="checkbox">
                除濕機已開啟
              </label>
            </div>
          </div>

          <button id="check-out-button" class="danger-button" type="button">簽退</button>
        </div>

        <button id="refresh-button" class="secondary-button" type="button">
          重新整理簽到狀態
        </button>
      </section>
    </div>
  </main>
</body>
</html>
